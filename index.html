<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kazoo Marathon</title>
<meta name="description" content="Kazoo Marathon · 18 de noviembre, 8:00 PM. Míralo en Twitch, Kick, YouTube y TikTok.">
<meta name="theme-color" content="#040205">
<meta property="og:type" content="website">
<meta property="og:title" content="Kazoo Marathon">
<meta property="og:description" content="18 de noviembre · 8:00 PM">
<meta property="og:url" content="https://kazoogod02.github.io/kazoo-marathon/">
<meta property="og:image" content="https://kazoogod02.github.io/kazoo-marathon/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script>document.documentElement.classList.add('intro');   // solo con JS: sin JS la página se ve directo</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'GTA Art Deco'; src: url('fonts/GTAArtDeco-Medium.ttf') format('truetype'); font-weight: 500; font-display: block; }

  :root { --bg: #040205; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'Space Grotesk', sans-serif; color: #fff; }

  /* sin selección ni resaltado azul al tocar o hacer clic */
  html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input { -webkit-user-select: text; user-select: text; }
  * { -webkit-tap-highlight-color: transparent; }
  :focus:not(:focus-visible) { outline: none; }
  a, svg, img { -webkit-user-drag: none; }

  /* ---------- glow (WebGL) ---------- */
  #glow { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* respaldo si no hay WebGL: el glow estático del concepto C */
  .fallback { position: fixed; inset: 0; display: none; }
  .no-gl .fallback { display: block; }
  .no-gl #glow { display: none; }
  .fallback::before, .fallback::after {
    content: ''; position: absolute; top: -10vh; height: 120vh; width: 9vw; filter: blur(3vw); mix-blend-mode: screen;
  }
  .fallback::before { left: -5vw; background: linear-gradient(180deg, transparent 8%, #ff4fb0 35%, #c03cff 60%, #5a1cc9 80%, transparent 95%); }
  .fallback::after  { right: -5vw; opacity: .75; background: linear-gradient(180deg, #7b2cff 10%, #e04bff 40%, #ff5fa8 65%, transparent 90%); }

  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%); }
  .grain {
    position: fixed; inset: -50%; z-index: 10; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); }
    60% { transform: translate(-2%,-1%); } 80% { transform: translate(3%,3%); } 100% { transform: translate(0,0); }
  }

  /* ---------- contenido ---------- */
  .content {
    position: relative; z-index: 5; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(22px, 4vh, 44px); text-align: center; padding: 0 16px;
  }
  .count { display: flex; align-items: flex-start; font-family: 'GTA Art Deco', sans-serif; font-weight: 500; line-height: 1; }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .num, .sep {
    font-size: clamp(40px, 6.4vw, 124px); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 .03em #fff, 0 0 .14em rgba(255,255,255,.55), 0 0 .45em rgba(255,255,255,.2), 0 0 1em rgba(255,150,220,.18);
  }
  .sep { opacity: .3; margin: 0 .18em; }
  .unit small { font-size: clamp(8px, .6vw, 11px); letter-spacing: .45em; padding-left: .45em; opacity: .45; margin-top: 1.6em; }
  .date { font-size: clamp(10px, .75vw, 13px); letter-spacing: .4em; padding-left: .4em; color: #ffd6ea; opacity: .75; }

  /* ---------- plataformas ---------- */
  .links { display: flex; gap: clamp(14px, 2.2vw, 36px); margin-top: clamp(8px, 2vh, 24px); }
  .links a {
    display: grid; place-items: center; width: 52px; height: 52px; color: #fff; opacity: .72;
    transition: opacity .35s, transform .35s, filter .35s;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.25));
  }
  .links svg { width: 26px; height: 26px; fill: currentColor; }
  .links a:hover, .links a:focus-visible {
    opacity: 1; transform: translateY(-2px);
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(255,255,255,.6)) drop-shadow(0 0 30px rgba(255,140,210,.5));
  }
  .links a:focus-visible { outline: none; }

  /* ---------- al llegar a cero: se va el contador, se quedan los logos ---------- */
  .count, .date { transition: opacity 1.2s ease, filter 1.2s ease; }
  .links, .links a, .links svg { transition: gap 1.2s ease, width 1.2s ease, height 1.2s ease, opacity .35s, transform .35s, filter .35s; }
  .live .count, .live .date { opacity: 0; filter: blur(12px); position: absolute; pointer-events: none; }
  .live .links { gap: clamp(18px, 3vw, 48px); }
  .live .links a { width: 58px; height: 58px; }
  .live .links svg { width: 30px; height: 30px; }
  .live .links a { opacity: .9; }

  /* ---------- stream (solo cuando ya empezó) ---------- */
  .elapsed {
    display: none; font-family: 'GTA Art Deco', sans-serif; font-weight: 500; font-variant-numeric: tabular-nums;
    font-size: clamp(16px, 1.4vw, 22px); letter-spacing: .08em; opacity: .85;
    margin-bottom: calc(-1 * clamp(8px, 2vh, 22px));          /* más pegado al player */
    text-shadow: 0 0 .04em #fff, 0 0 .3em rgba(255,255,255,.45), 0 0 .9em rgba(255,150,220,.3);
  }
  .live .elapsed { display: block; animation: rise 1.4s ease both; }
  .player {
    display: none; width: min(880px, 100%, calc((100vh - 300px) * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; background: #000;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 0 40px rgba(255,90,180,.18), 0 0 120px rgba(150,60,255,.15);
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .live .player { display: block; animation: rise 1.4s ease both; }
  /* ---------- al acabar: sin player, el tiempo congelado al centro ---------- */
  .ended-label { display: none; font-size: clamp(10px, .75vw, 13px); letter-spacing: .4em; padding-left: .4em; color: #ffd6ea; opacity: .75; }
  .ended .ended-label { display: block; animation: rise 1.4s ease both; margin-bottom: calc(-1 * clamp(8px, 2vh, 22px)); }
  .ended .player { display: none; }
  .ended .elapsed { font-size: clamp(28px, 3.6vw, 68px); margin-bottom: 0; opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }

  /* ---------- VI → logo ---------- */
  .mark {
    position: fixed; left: 50%; bottom: clamp(16px, 3.5vh, 36px); transform: translateX(-50%); z-index: 6;
    background: none; border: 0; padding: 12px; cursor: pointer; color: #fff; opacity: .55;
    filter: drop-shadow(0 0 4px rgba(255,255,255,.3));
    transition: opacity .5s, filter .5s; -webkit-tap-highlight-color: transparent;
  }
  .mark svg { display: block; height: 24px; width: auto; overflow: visible; }
  .mark path { fill: currentColor; }
  /* ---------- intro: la K aparece sobre el fondo desenfocado ---------- */
  .loader { display: none; position: fixed; inset: 0; z-index: 20; place-items: center; pointer-events: none; }
  .intro .loader { display: grid; }
  .loader svg {
    width: clamp(64px, 8vw, 104px); height: auto; fill: #fff; opacity: 0; transform: scale(.94);
    filter: blur(8px) drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent);
  }
  .intro-show .loader svg { animation: kIn 1.1s cubic-bezier(.2, .7, .2, 1) .15s forwards; }
  .intro-out .loader svg { animation: kOut .9s ease forwards; }
  @keyframes kIn {
    to { opacity: 1; transform: none;
         filter: blur(0) drop-shadow(0 0 4px #fff) drop-shadow(0 0 18px rgba(255,255,255,.55)) drop-shadow(0 0 48px rgba(255,140,210,.45)); }
  }
  @keyframes kOut {
    from { opacity: 1; transform: none;
           filter: blur(0) drop-shadow(0 0 4px #fff) drop-shadow(0 0 18px rgba(255,255,255,.55)) drop-shadow(0 0 48px rgba(255,140,210,.45)); }
    to   { opacity: 0; transform: scale(1.06);
           filter: blur(10px) drop-shadow(0 0 4px #fff) drop-shadow(0 0 18px rgba(255,255,255,.55)) drop-shadow(0 0 48px rgba(255,140,210,.45)); }
  }
  /* el fondo se revela desenfocado (un poco escalado para que el blur no oscurezca las orillas) y luego se enfoca */
  #glow, .fallback { transition: opacity 1.2s ease, filter 1.1s ease, transform 1.4s cubic-bezier(.2, .7, .2, 1); }
  .intro #glow, .intro .fallback { opacity: 0; filter: blur(28px); transform: scale(1.12); }
  .intro-show #glow, .intro-show .fallback { opacity: 1; }
  .intro-out #glow, .intro-out .fallback { filter: blur(0); transform: none; }
  .content { transition: opacity 1s ease .25s, transform 1.1s cubic-bezier(.2, .7, .2, 1) .25s, filter 1s ease .25s; }
  .intro .content, .intro .mark { opacity: 0; }
  .intro-out .content { opacity: 1; }
  .intro-out .mark { opacity: .55; }

  .mark:hover, .mark.on, .mark:focus-visible {
    opacity: 1; outline: none;
    filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px rgba(255,255,255,.5)) drop-shadow(0 0 26px rgba(255,140,210,.45));
  }

  /* ---------- VODs: la portada se va hacia arriba desenfocándose y la galería sube desde abajo ---------- */
  .vods-open .content { opacity: 0; transform: translateY(-7vh) scale(.96); filter: blur(14px); pointer-events: none; transition-delay: 0s; }
  .vods-open #glow, .vods-open .fallback { transform: scale(1.08); filter: blur(5px) brightness(.72); }   /* el fondo se aleja */
  .vods {
    position: fixed; inset: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain;
    padding: clamp(56px, 11vh, 120px) clamp(16px, 5vw, 72px) 140px;
    -webkit-mask-image: linear-gradient(transparent, #000 5vh, #000 calc(100% - 16vh), transparent);
            mask-image: linear-gradient(transparent, #000 5vh, #000 calc(100% - 16vh), transparent);
    opacity: 0; visibility: hidden; transform: translateY(7vh) scale(.98); filter: blur(14px);
    transition: opacity .8s ease, transform 1.1s cubic-bezier(.2, .7, .2, 1), filter .8s ease, visibility 0s linear 1.1s;
  }
  .vods-open .vods {
    opacity: 1; visibility: visible; transform: none; filter: none;
    transition-delay: .25s, .25s, .25s, 0s;
  }
  .vods h2, .vods-empty {
    font-size: clamp(10px, .75vw, 13px); font-weight: 400; letter-spacing: .4em; padding-left: .4em;
    color: #ffd6ea; opacity: .75; text-align: center;
  }
  .vods h2 { margin-bottom: clamp(28px, 6vh, 64px); }
  .vods-empty { opacity: .4; margin-top: 8vh; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    gap: clamp(26px, 3.4vw, 44px) clamp(16px, 2.4vw, 32px); max-width: 1280px; margin: 0 auto;
  }
  .card { display: block; color: #fff; text-decoration: none; cursor: pointer; outline: none; }
  .vods-open .card { animation: rise .9s ease both; animation-delay: calc(.35s + var(--i) * 70ms); }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
    transition: transform .45s cubic-bezier(.2, .7, .2, 1), box-shadow .45s, border-color .45s;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.9) brightness(.92); transition: transform .7s cubic-bezier(.2, .7, .2, 1), filter .5s; }
  .card:hover .thumb, .card:focus-visible .thumb {
    transform: translateY(-3px); border-color: rgba(255,255,255,.3);
    box-shadow: 0 0 30px rgba(255,90,180,.22), 0 0 90px rgba(150,60,255,.18);
  }
  .card:hover img, .card:focus-visible img { transform: scale(1.04); filter: none; }
  .card p { margin-top: 12px; font-size: 13px; font-weight: 300; letter-spacing: .03em; line-height: 1.4; opacity: .7; transition: opacity .35s; }
  .card:hover p, .card:focus-visible p { opacity: 1; }
  .card.dragging { opacity: .3; }
  .card.over .thumb { border-color: #ffd6ea; }

  /* el "+": sin fondo, contorno de rayas largas */
  .dash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .dash rect { x: .6px; y: .6px; width: calc(100% - 1.2px); height: calc(100% - 1.2px); fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 16 11; transition: stroke-dashoffset .9s ease; }
  .add .thumb { background: none; border: 0; display: grid; place-items: center; color: rgba(255,255,255,.45); transition: color .4s, transform .45s cubic-bezier(.2, .7, .2, 1), box-shadow .45s; }
  .add .plus { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.4; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
  .add:hover .thumb, .add:focus-visible .thumb { color: #fff; box-shadow: none; }
  .add:hover .plus, .add:focus-visible .plus { transform: rotate(90deg) scale(1.1); }
  .add:hover rect, .add:focus-visible rect { stroke-dashoffset: -54; }

  /* ---------- editor (solo ?admin) ---------- */
  .edit {
    margin: auto; width: min(440px, calc(100% - 32px)); padding: 24px; color: #fff;
    background: rgba(18, 8, 24, .72); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
    box-shadow: 0 0 60px rgba(255,90,180,.15), 0 0 140px rgba(150,60,255,.12);
  }
  .edit[open] { animation: rise .5s ease both; }
  .edit::backdrop { background: rgba(4,2,5,.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .edit form { display: flex; flex-direction: column; gap: 18px; }
  .edit .pick { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; display: grid; place-items: center; cursor: pointer; color: rgba(255,255,255,.5); background: center / cover no-repeat; }
  .edit .pick span { font-size: 11px; letter-spacing: .2em; font-weight: 300; padding: 6px 10px; border-radius: 6px; background: rgba(4,2,5,.5); }
  .edit .pick.has span { opacity: 0; transition: opacity .3s; }
  .edit .pick.has:hover span { opacity: 1; }
  .edit .pick.has .dash { display: none; }
  .edit label:not(.pick) { display: flex; flex-direction: column; gap: 6px; font-size: 10px; letter-spacing: .3em; color: #ffd6ea; opacity: .85; }
  .edit input:not([type=file]) {
    font: 300 15px 'Space Grotesk', sans-serif; color: #fff; background: none; border: 0; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.18); outline: none; letter-spacing: .02em; transition: border-color .3s;
  }
  .edit input:focus { border-color: #ffd6ea; }
  .edit .row { display: flex; gap: 10px; align-items: center; }
  .edit .row span { flex: 1; }
  .edit button {
    font: 400 12px 'Space Grotesk', sans-serif; letter-spacing: .15em; color: #040205; background: #fff;
    border: 0; border-radius: 99px; padding: 10px 18px; cursor: pointer; transition: box-shadow .3s, opacity .3s;
  }
  .edit button:hover { box-shadow: 0 0 18px rgba(255,255,255,.45), 0 0 40px rgba(255,140,210,.35); }
  .edit button.ghost { background: none; color: #fff; opacity: .6; padding: 10px 6px; }
  .edit button.ghost:hover { opacity: 1; box-shadow: none; }
  .edit button:disabled { opacity: .4; pointer-events: none; }
  .edit .err { font-size: 12px; color: #ff8fc4; min-height: 1em; margin: -6px 0; }

  @media (orientation: portrait) {
    .num, .sep { font-size: 11.5vw; }
    .sep { margin: 0 .1em; }
    .unit small { font-size: 8px; letter-spacing: .3em; padding-left: .3em; }
  }
</style>
</head>
<body>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="content">
    <div class="count">
      <div class="unit"><span class="num" id="d">00</span><small>DÍAS</small></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="h">00</span><small>HRS</small></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="m">00</span><small>MIN</small></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="s">00</span><small>SEG</small></div>
    </div>
    <p class="date">18 NOV · 8:00 PM</p>
    <p class="ended-label">TIEMPO TRANSCURRIDO</p>
    <div class="elapsed" id="elapsed" aria-label="Tiempo en vivo">00:00:00</div>
    <div class="player" id="player"></div>
    <nav class="links" aria-label="Plataformas">
      <a id="l-twitch" aria-label="Twitch" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
      </a>
      <a id="l-kick" aria-label="Kick" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>
      </a>
      <a id="l-youtube" aria-label="YouTube" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
      <a id="l-tiktok" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
      </a>
    </nav>
  </main>

  <section class="vods" id="vods" aria-label="VODs y clips">
    <h2>VODS Y CLIPS</h2>
    <div class="grid" id="grid"></div>
    <p class="vods-empty" id="vods-empty" hidden>PRONTO</p>
  </section>

  <dialog class="edit" id="edit">
    <form>
      <label class="pick" id="pick">
        <svg class="dash" aria-hidden="true"><rect width="100%" height="100%" rx="10"/></svg>
        <input type="file" accept="image/*" id="f-file" hidden>
        <span>SUBIR MINIATURA</span>
      </label>
      <label>ENLACE<input id="f-url" type="url" required placeholder="https://"></label>
      <label>TÍTULO<input id="f-title" required maxlength="120"></label>
      <label id="f-token-row">TOKEN DE GITHUB<input id="f-token" type="password" autocomplete="off"></label>
      <p class="err" id="f-err"></p>
      <div class="row">
        <button type="button" class="ghost" id="f-del">QUITAR</button><span></span>
        <button type="button" class="ghost" id="f-cancel">CANCELAR</button>
        <button id="f-save">GUARDAR</button>
      </div>
    </form>
  </dialog>

  <div class="loader" id="loader" aria-hidden="true">
    <svg viewBox="-2.3 -.5 11.8 12"><path transform="skewX(-9.28)" d="M0 0H3V3H4V2H5V1H6V0H9V3H8V4H7V5H6V6H7V7H8V8H9V11H6V10H5V9H4V8H3V11H0Z"/></svg>
  </div>

  <button class="mark" id="mark" aria-label="Kazoo">
    <svg viewBox="-8.5 -6 17 12" aria-hidden="true"><path id="mark-a"/><path id="mark-b"/></svg>
  </button>

<script id="frag" type="x-shader/x-fragment">
  precision highp float;
  uniform vec2 r;
  uniform float t;

  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3. - 2. * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p) {
    float v = 0., a = .5;
    for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; }
    return v;
  }

  // Luz que entra por una orilla.
  // d: distancia a la orilla · y: posición a lo largo de la orilla · s: semilla
  vec3 edge(float d, float y, float s, vec3 cA, vec3 cB) {
    float yy = y + (fbm(vec2(y * 1.3 + s, t * .07 + s)) - .5) * .35;          // deformación orgánica
    float m = .3 + .7 * smoothstep(.3, .7, fbm(vec2(yy * 1.6 + s * 3., t * .09 - s))); // zonas que se encienden y apagan
    float w = .06 + .08 * fbm(vec2(yy * 2.2 - s, t * .12 + s * 2.));          // el grosor respira
    float body = exp(-pow(d / w, 1.6)) * m * 1.9;                             // cuerpo de luz concentrado
    float tail = exp(-d / (w * 1.6)) * m * .3;                                // derrame suave hacia el centro
    float core = exp(-d / (w * .12)) * m * m * 1.4;                           // núcleo caliente pegado a la orilla
    float wisp = fbm(vec2(d * 5. - t * .06, yy * 3.5 + t * .03 + s));
    float haze = exp(-d / (w * 2.)) * smoothstep(.45, .85, wisp) * m * .45;   // neblina que se adentra
    vec3 col = mix(cA, cB, smoothstep(.3, .7, fbm(vec2(yy * 1.1 + s * 5., t * .05))));
    return col * (body + tail + haze) + vec3(1., .8, .92) * core;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / r;
    float U = min(r.y, r.x * 1.1);              // unidad: alto en escritorio, más angosto en celular
    float x = gl_FragCoord.x / U, W = r.x / U;
    float flick = 1. + .03 * sin(t * 2.1) + .03 * (noise(vec2(t * 2.7, 3.)) - .5);

    vec3 c  = edge(x,     uv.y, 0.,  vec3(1., .26, .62), vec3(.56, .18, 1.)) * 1.05;
    c      += edge(W - x, uv.y, 7.3, vec3(.62, .2, 1.),  vec3(1., .33, .7))  * .85;
    c      += edge(gl_FragCoord.y / U * 1.6, uv.x, 13.1, vec3(1., .3, .6), vec3(.5, .15, .9)) * .12;
    c *= flick;
    c = 1. - exp(-c * 1.1);                        // tono fílmico: la luz satura suave, sin quemarse
    c = clamp(mix(vec3(dot(c, vec3(.299, .587, .114))), c, 1.4), 0., 1.);  // más color, menos gris
    gl_FragColor = vec4(c, 1.);
  }
</script>
<script>
  // ---------- intro ----------
  (() => {
    const root = document.documentElement;
    const hold = new Promise(r => setTimeout(r, 1700));            // tiempo mínimo para que la K luzca
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('intro-show')));
    Promise.all([hold, document.fonts.ready]).then(() => {
      root.classList.add('intro-out');
      setTimeout(() => {
        root.classList.remove('intro', 'intro-show', 'intro-out');
        document.getElementById('loader').remove();
      }, 1300);
    });
  })();

  // ---------- glow ----------
  (() => {
    const cv = document.getElementById('glow');
    const gl = cv.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) { document.documentElement.classList.add('no-gl'); return; }

    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}'));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.documentElement.classList.add('no-gl'); return; }
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uR = gl.getUniformLocation(prog, 'r'), uT = gl.getUniformLocation(prog, 't');

    // el glow es suave: se renderiza a media resolución y el navegador lo escala
    const SCALE = 0.5;
    function resize() {
      cv.width = Math.max(1, Math.round(innerWidth * SCALE));
      cv.height = Math.max(1, Math.round(innerHeight * SCALE));
      gl.viewport(0, 0, cv.width, cv.height);
    }
    addEventListener('resize', resize); resize();

    const slow = matchMedia('(prefers-reduced-motion: reduce)').matches ? .25 : 1;
    const offset = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
    const t0 = performance.now();
    (function frame(now) {
      gl.uniform2f(uR, cv.width, cv.height);
      gl.uniform1f(uT, offset + (now - t0) / 1000 * slow);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    })(t0);
  })();

  // ---------- plataformas ----------
  const USER = 'kazoogod02';
  const LINKS = {
    twitch:  'https://twitch.tv/' + USER,
    kick:    'https://kick.com/' + USER,
    youtube: 'https://youtube.com/@' + USER,
    tiktok:  'https://tiktok.com/@' + USER,
  };
  for (const [k, url] of Object.entries(LINKS)) document.getElementById('l-' + k).href = url;

  // ---------- stream ----------
  // El player de Twitch solo necesita el usuario; se carga hasta que empieza para no gastar datos antes.
  function goLive() {
    const root = document.documentElement;
    if (root.classList.contains('live')) return;
    root.classList.add('live');
    const parents = [...new Set(['kazoogod02.github.io', location.hostname || 'localhost'])];
    // ?canal=otro para previsualizar con un stream que esté en vivo ahorita
    const channel = new URLSearchParams(location.search).get('canal') || USER;
    // API de embed de Twitch: avisa cuando el preview de verdad está reproduciendo, para callar la música
    const js = document.createElement('script');
    js.src = 'https://player.twitch.tv/js/embed/v1.js';
    js.onload = () => {
      const p = new Twitch.Player('player', {
        channel, parent: parents, muted: true, autoplay: true, width: '100%', height: '100%',
      });
      // si ya estuvo en vivo y se apaga, terminó: se va el player y el tiempo se congela
      p.addEventListener(Twitch.Player.PLAYING, () => { streaming = true; music.pause(); root.classList.remove('ended'); });
      p.addEventListener(Twitch.Player.OFFLINE, () => {
        if (streaming) root.classList.add('ended');
        streaming = false; playMusic();
      });
    };
    document.head.appendChild(js);
  }

  // ---------- música de espera ----------
  // Suena al entrar y se calla cuando el player de Twitch está mostrando el stream.
  const music = new Audio('pause.mp3');
  music.loop = true;
  let streaming = false;
  const playMusic = () => { if (!streaming) music.play().catch(() => {}); };
  playMusic();
  // los navegadores bloquean el audio hasta que la persona interactúa: arranca al primer toque/tecla
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, playMusic, { once: true });

  // ---------- VI → logo ----------
  // La V se cierra en el tallo de la K y la I se dobla en el brazo escalonado.
  // Coordenadas en la cuadrícula del logo (9×11 bloques); cada par de figuras tiene los mismos puntos.
  (() => {
    const SKEW = 0.1634;                                   // inclinación del logo
    const lerp = (a, b, t) => a + (b - a) * t;
    const along = (a, b, n) => Array.from({ length: n }, (_, i) => [lerp(a[0], b[0], (i + 1) / (n + 1)), lerp(a[1], b[1], (i + 1) / (n + 1))]);

    const V    = [[0, 0], [4.3, 0], [5.6, 4.2], [6.9, 0], [11.2, 0], [5.65, 11], [5.55, 11]];   // punta abajo
    const STEM = [[0, 0], [.75, 0], [1.5, 0], [2.25, 0], [3, 0], [3, 11], [0, 11]];
    const I    = [[12.1, 0], [16.4, 0], ...along([16.4, 0], [16.4, 11], 12), [16.4, 11], [12.1, 11], ...along([12.1, 11], [12.1, 0], 12)];
    const ARM  = [[6, 0], [9, 0], [9, 3], [8, 3], [8, 4], [7, 4], [7, 5], [6, 5], [6, 6], [7, 6], [7, 7], [8, 7], [8, 8], [9, 8],
                  [9, 11], [6, 11], [6, 10], [5, 10], [5, 9], [4, 9], [4, 8], [2.6, 8], [2.6, 3], [4, 3], [4, 2], [5, 2], [5, 1], [6, 1]];

    // centrar ambos estados en (0,0); la K lleva su inclinación
    const vi = p => [p[0] - 8.2, p[1] - 5.5];
    const k  = p => [p[0] - 4.5 - SKEW * (p[1] - 5.5), p[1] - 5.5];
    const pairs = [[V.map(vi), STEM.map(k)], [I.map(vi), ARM.map(k)]];
    const paths = [document.getElementById('mark-a'), document.getElementById('mark-b')];

    const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    function draw(t) {
      pairs.forEach(([a, b], n) => {
        // los puntos de arriba arrancan un poco antes: se siente como una ola, no como un tween plano
        const pts = a.map((p, i) => {
          const e = ease(Math.min(1, Math.max(0, t * 1.3 - (p[1] + 5.5) / 11 * .3)));
          return lerp(p[0], b[i][0], e).toFixed(3) + ' ' + lerp(p[1], b[i][1], e).toFixed(3);
        });
        paths[n].setAttribute('d', 'M' + pts.join('L') + 'Z');
      });
    }

    const mark = document.getElementById('mark');
    let t = 0, target = 0, last = 0, raf = 0;
    function step(now) {
      const dt = last ? now - last : 16; last = now;
      t = target > t ? Math.min(target, t + dt / 750) : Math.max(target, t - dt / 750);
      draw(t);
      raf = t !== target ? requestAnimationFrame(step) : (last = 0);
    }
    function to(v) {
      target = v; mark.classList.toggle('on', v === 1);
      if (!raf) raf = requestAnimationFrame(step);
    }
    // el logo abre/cierra los VODs (#vods); mientras están abiertos se queda como K
    const isOpen = () => location.hash === '#vods';
    function sync() {
      document.documentElement.classList.toggle('vods-open', isOpen());
      mark.setAttribute('aria-label', isOpen() ? 'Volver' : 'VODs y clips');
      to(isOpen() || mark.matches(':hover') ? 1 : 0);
    }
    addEventListener('hashchange', sync);
    mark.addEventListener('click', () => {
      if (!isOpen()) location.hash = 'vods';
      else { history.pushState('', '', location.pathname + location.search); sync(); }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen() && !document.querySelector('dialog[open]')) mark.click(); });
    mark.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') to(1); });
    mark.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') to(isOpen() ? 1 : 0); });
    mark.addEventListener('focus', () => { if (mark.matches(':focus-visible')) to(1); });
    mark.addEventListener('blur', () => { if (!mark.matches(':hover')) to(isOpen() ? 1 : 0); });
    sync();
    draw(parseFloat(new URLSearchParams(location.search).get('mark')) || 0);   // ?mark=1 para previsualizar
  })();

  // ---------- contador ----------
  // 18 nov 2026, 8:00 PM Culiacán (UTC-7) = 19 nov 03:00 UTC
  const T = Date.UTC(2026, 10, 19, 3, 0, 0);
  const forceLive = new URLSearchParams(location.search).has('live');   // ?live para previsualizar
  const liveStart = forceLive && Date.now() < T ? Date.now() : T;       // en preview el tiempo corre desde que abres
  const $ = id => document.getElementById(id);
  function tick() {
    if (forceLive || Date.now() >= T) {
      goLive();
      if (document.documentElement.classList.contains('ended')) return;   // congelado al acabar
      // tiempo que lleva el stream; las horas siguen subiendo después de 24
      let e = Math.max(0, Math.floor((Date.now() - liveStart) / 1000));
      const eh = Math.floor(e / 3600); e %= 3600;
      $('elapsed').textContent = [eh, Math.floor(e / 60), e % 60].map(v => String(v).padStart(2, '0')).join(':');
      return;
    }
    let s = Math.max(0, Math.floor((T - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600);  s %= 3600;
    const m = Math.floor(s / 60);    s %= 60;
    [['d', d], ['h', h], ['m', m], ['s', s]].forEach(([k, v]) => $(k).textContent = String(v).padStart(2, '0'));
  }
  tick(); setInterval(tick, 1000);

  // ---------- VODs y clips ----------
  // La lista vive en vods.json en el repo. Todos la leen; con ?admin la editas y se guarda directo en GitHub con tu token.
  (() => {
    const API = 'https://api.github.com/repos/KazooGod02/kazoo-marathon/contents/';
    const admin = new URLSearchParams(location.search).has('admin');
    const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                    set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
    let vods = [], sha, token = store.get('gh-token');
    const local = {};                                                   // miniaturas recién subidas, antes de que Pages las publique

    const ytId = u => (String(u).match(/(?:youtu\.be\/|[?&]v=|\/(?:live|shorts|embed)\/)([\w-]{11})/) || [])[1];
    const thumbOf = (v, file) => file || local[v.thumb] || v.thumb || (ytId(v.url) ? `https://i.ytimg.com/vi/${ytId(v.url)}/hqdefault.jpg` : '');
    const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
    const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

    const gh = (path, body) => fetch(API + path, {
      method: body ? 'PUT' : 'GET', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      body: body && JSON.stringify(body),
    }).then(async r => {
      if (r.status === 401) { store.set('gh-token', token = null); throw new Error('Token inválido, ponlo de nuevo'); }
      if (!r.ok) throw new Error('GitHub respondió ' + r.status);
      return r.json();
    });
    async function save(msg) {
      render();
      const r = await gh('vods.json', { message: msg, content: b64(JSON.stringify(vods, null, 2) + '\n'), sha });
      sha = r.content.sha;
    }

    // ---- galería ----
    const grid = $('grid');
    let from = -1;
    function card(i, v) {
      const a = document.createElement('a');
      a.className = 'card'; a.style.setProperty('--i', i);
      a.innerHTML = '<div class="thumb"></div><p></p>';
      const src = thumbOf(v);
      if (src) { const img = new Image(); img.src = src; img.alt = ''; img.loading = 'lazy'; img.draggable = false; a.firstChild.append(img); }
      a.lastChild.textContent = v.title;
      if (!admin) { a.href = v.url; a.target = '_blank'; a.rel = 'noopener'; return a; }
      // admin: clic = editar, arrastrar = reordenar
      a.href = '#vods'; a.draggable = true;
      a.onclick = e => { e.preventDefault(); open(i); };
      a.ondragstart = e => { from = i; e.dataTransfer.setData('text/plain', ''); a.classList.add('dragging'); };
      a.ondragend = () => a.classList.remove('dragging');
      a.ondragover = e => { e.preventDefault(); a.classList.add('over'); };
      a.ondragleave = () => a.classList.remove('over');
      a.ondrop = e => {
        e.preventDefault(); a.classList.remove('over');
        if (from < 0 || from === i) return;
        vods.splice(i, 0, vods.splice(from, 1)[0]); from = -1;
        save('Reordenar VODs').catch(fail);
      };
      return a;
    }
    function render() {
      grid.replaceChildren(...vods.map((v, i) => card(i, v)));
      if (admin) {
        const add = document.createElement('a');
        add.className = 'card add'; add.href = '#vods'; add.style.setProperty('--i', vods.length);
        add.setAttribute('aria-label', 'Añadir VOD o clip');
        add.innerHTML = '<div class="thumb"><svg class="dash" aria-hidden="true"><rect width="100%" height="100%" rx="10"/></svg>'
          + '<svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg></div><p>&nbsp;</p>';
        add.onclick = e => { e.preventDefault(); open(-1); };
        grid.append(add);
      }
      $('vods-empty').hidden = admin || vods.length > 0;
    }

    // ---- editor ----
    const dlg = $('edit'), form = dlg.querySelector('form'), pick = $('pick'), err = $('f-err');
    let editing = -1, file = null;
    const fail = e => { err.textContent = e.message; if (!dlg.open) alert(e.message); };
    function preview() {
      const src = thumbOf({ url: $('f-url').value, thumb: editing >= 0 ? vods[editing].thumb : '' }, file);
      pick.style.backgroundImage = src ? `url("${src}")` : '';
      pick.classList.toggle('has', !!src);
    }
    function open(i) {
      editing = i; file = null; err.textContent = '';
      const v = vods[i] || { url: '', title: '' };
      $('f-url').value = v.url; $('f-title').value = v.title; $('f-file').value = '';
      $('f-del').hidden = i < 0;
      $('f-token-row').hidden = !!token;
      $('f-token').required = !token;
      preview(); dlg.showModal();
    }
    // las miniaturas se achican a 1280px en jpg para que la página cargue rápido
    const shrink = f => new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'), s = Math.min(1, 1280 / img.width);
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = URL.createObjectURL(f);
    });
    $('f-file').onchange = async e => { if (e.target.files[0]) { file = await shrink(e.target.files[0]).catch(fail); preview(); } };
    $('f-url').oninput = preview;
    $('f-cancel').onclick = () => dlg.close();
    $('f-del').onclick = () => {
      if (!confirm(`¿Quitar "${vods[editing].title}"?`)) return;
      vods.splice(editing, 1); dlg.close();
      save('Quitar VOD').catch(fail);
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const url = $('f-url').value.trim(), title = $('f-title').value.trim();
      if (!/^https?:\/\//i.test(url)) return err.textContent = 'El enlace debe empezar con https://';
      if (!token) store.set('gh-token', token = $('f-token').value.trim());
      const v = { ...(vods[editing] || {}), url, title };
      if (!file && !v.thumb && !ytId(url)) return err.textContent = 'Sube una miniatura (solo YouTube se saca sola)';
      $('f-save').disabled = true; err.textContent = 'Guardando…';
      try {
        if (!sha) sha = (await gh('vods.json')).sha;
        if (file) {
          const path = `vods/${Date.now()}.jpg`;
          await gh(path, { message: 'Miniatura: ' + title, content: file.split(',')[1] });
          v.thumb = path; local[path] = file;
        }
        editing >= 0 ? (vods[editing] = v) : vods.push(v);
        await save((editing >= 0 ? 'Editar' : 'Añadir') + ' VOD: ' + title);
        dlg.close();
      } catch (e) { fail(e); if (!token) { $('f-token-row').hidden = false; $('f-token').required = true; } }
      $('f-save').disabled = false;
    };

    // en admin se lee de la API (sin esperar a que Pages publique); el resto lee el archivo publicado
    (async () => {
      try { if (!admin || !token) throw 0; const r = await gh('vods.json'); sha = r.sha; vods = JSON.parse(unb64(r.content)); }
      catch {
        try { vods = await (await fetch('vods.json?' + Date.now(), { cache: 'no-store' })).json(); } catch { vods = []; }
      }
      render();
    })();
  })();
</script>
</body>
</html>
