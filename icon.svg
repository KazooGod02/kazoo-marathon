    <path fill="#fff" transform="translate(19.8 13.3) scale(3.4) skewX(-9.28)" d="M0 0H3V3H4V2H5V1H6V0H9V3H8V4H7V5H6V6H7V7H8V8H9V11H6V10H5V9H4V8H3V11H0Z"/>
